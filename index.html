<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InvestMal AI - Institutional Intelligence</title>
    <meta name="description" content="Decision Intelligence Platform" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              institutional: {
                900: '#0B1120', // Deep background
                800: '#151E32', // Panel background
                700: '#1E293B', // Border/Hover
                600: '#334155', // Muted text
                500: '#64748B', // Secondary text
                100: '#F1F5F9', // Primary text
              },
              accent: {
                up: '#10B981',   // Growth/Safe
                down: '#EF4444', // Decline/Risk
                warn: '#F59E0B', // Caution/Volatility
                info: '#3B82F6', // Neutral/Info
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0B1120;
        color: #F1F5F9;
      }
      /* Custom scrollbar for data panels */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0B1120;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
    </style>
